name: Source review evidence

on:
  workflow_dispatch:
  schedule:
    - cron: '17 11 * * 5'

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Validate source registry and guide
        run: python scripts/check_guide.py
      - name: Fetch public source evidence for human review
        run: python scripts/source_watch.py --output work/source-review.json
      - name: Preserve evidence including failed fetches
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: source-review-${{ github.run_id }}
          path: work/source-review.json
          if-no-files-found: warn
          retention-days: 30
